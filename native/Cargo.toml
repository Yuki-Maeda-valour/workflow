[workspace]
members = ["crates/cli", "crates/core", "crates/platform", "crates/yaml-parser"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
workflow-yaml-parser = { path = "crates/yaml-parser" }
dev-workflow-core = { path = "crates/core" }
dev-workflow-platform = { path = "crates/platform" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
libc = "0.2.191"
rustix = { version = "=1.1.6", features = ["fs", "event", "termios"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
strip = "symbols"
debug = 0
incremental = false
