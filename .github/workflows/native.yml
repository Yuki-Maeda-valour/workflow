{
  "name": "Native",
  "on": {
    "pull_request": {},
    "push": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "policy": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "CI のスクリプトをテスト",
          "run": "python3 -B native/ci/build.py test"
        }
      ]
    },
    "build": {
      "needs": "policy",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "platform": "linux-x86_64",
              "runner": "ubuntu-24.04"
            },
            {
              "platform": "linux-arm64",
              "runner": "ubuntu-24.04-arm"
            },
            {
              "platform": "macos-x86_64",
              "runner": "macos-15-intel"
            },
            {
              "platform": "macos-arm64",
              "runner": "macos-15"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform '${{ matrix.platform }}'"
        },
        {
          "name": "検査と 2 回のビルド",
          "run": "python3 -B native/ci/build.py build --platform '${{ matrix.platform }}'"
        },
        {
          "name": "tar を保存",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "native-build-${{ matrix.platform }}",
            "path": "${{ runner.temp }}/native-ci/${{ matrix.platform }}.tar",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "combine": {
      "needs": "build",
      "runs-on": "macos-15",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform macos-arm64"
        },
        {
          "name": "tar を取得",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "pattern": "native-build-macos-*",
            "path": "${{ runner.temp }}/native-ci/downloads",
            "merge-multiple": true
          }
        },
        {
          "name": "2 回分の Mac を結合・署名・比較",
          "run": "python3 -B native/ci/build.py combine"
        },
        {
          "name": "tar を保存",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "native-universal",
            "path": "${{ runner.temp }}/native-ci/macos-universal.tar",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "verify-universal": {
      "needs": "combine",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "platform": "macos-x86_64",
              "runner": "macos-15-intel"
            },
            {
              "platform": "macos-arm64",
              "runner": "macos-15"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform '${{ matrix.platform }}'"
        },
        {
          "name": "tar を取得",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "native-universal",
            "path": "${{ runner.temp }}/native-ci/downloads",
            "merge-multiple": true
          }
        },
        {
          "name": "署名後の同じファイルを起動",
          "run": "python3 -B native/ci/build.py verify-universal"
        }
      ]
    },
    "distribution": {
      "needs": [
        "build",
        "combine",
        "verify-universal",
        "r4e",
        "r4e-universal"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform linux-x86_64"
        },
        {
          "name": "tar を取得",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "pattern": "native-build-linux-*",
            "path": "${{ runner.temp }}/native-ci/downloads",
            "merge-multiple": true
          }
        },
        {
          "name": "tar を取得",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "native-universal",
            "path": "${{ runner.temp }}/native-ci/downloads",
            "merge-multiple": true
          }
        },
        {
          "name": "5 ファイルを検査して tar にする",
          "run": "python3 -B native/ci/build.py package"
        },
        {
          "name": "tar を保存",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "native-dist",
            "path": "${{ runner.temp }}/native-ci/native-dist.tar",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "r4u": {
      "needs": "build",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "platform": "linux-x86_64",
              "runner": "ubuntu-24.04"
            },
            {
              "platform": "linux-arm64",
              "runner": "ubuntu-24.04-arm"
            },
            {
              "platform": "macos-x86_64",
              "runner": "macos-15-intel"
            },
            {
              "platform": "macos-arm64",
              "runner": "macos-15"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform '${{ matrix.platform }}'"
        },
        {
          "name": "R4U の比較(旧版・固定期待・Rust)",
          "run": "python3 -B native/ci/build.py r4u --platform '${{ matrix.platform }}'"
        }
      ]
    },
    "r4e": {
      "needs": "build",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "platform": "linux-x86_64",
              "runner": "ubuntu-24.04"
            },
            {
              "platform": "linux-arm64",
              "runner": "ubuntu-24.04-arm"
            },
            {
              "platform": "macos-x86_64",
              "runner": "macos-15-intel"
            },
            {
              "platform": "macos-arm64",
              "runner": "macos-15"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform '${{ matrix.platform }}'"
        },
        {
          "name": "tar を取得",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "native-build-${{ matrix.platform }}",
            "path": "${{ runner.temp }}/native-ci/downloads",
            "merge-multiple": true
          }
        },
        {
          "name": "2 回のビルドの r4e_contract で R4E の比較",
          "run": "python3 -B native/ci/build.py r4e --platform '${{ matrix.platform }}'"
        }
      ]
    },
    "r4e-universal": {
      "needs": "combine",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "platform": "macos-x86_64",
              "runner": "macos-15-intel"
            },
            {
              "platform": "macos-arm64",
              "runner": "macos-15"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "ソース SHA を取得",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "ワークフローを検査",
          "run": "python3 -B native/ci/check_workflow.py"
        },
        {
          "name": "比較用の Python 3.10.11 を用意",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.10.11"
          }
        },
        {
          "name": "Rust と比較用の依存を用意",
          "run": "python3 -B native/ci/build.py prepare --platform '${{ matrix.platform }}'"
        },
        {
          "name": "tar を取得",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "native-universal",
            "path": "${{ runner.temp }}/native-ci/downloads",
            "merge-multiple": true
          }
        },
        {
          "name": "署名後の r4e_contract で R4E の比較",
          "run": "python3 -B native/ci/build.py r4e-universal --platform '${{ matrix.platform }}'"
        }
      ]
    }
  }
}
